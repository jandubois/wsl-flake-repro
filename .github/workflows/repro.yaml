name: repro

on:
  workflow_dispatch:
    inputs:
      alpine_version:
        description: Alpine version for the rootfs
        default: "3.20.3"

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WSL_UTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: baseline
            extra_flags: ""
            iters: "2000"
            modes: "plain wsl-utf8 wait-delay stdin-null cmd-shim powershell-shim retry"
          - scenario: bigger-output
            extra_flags: "--bytes 4096"
            iters: "2000"
            modes: "plain wsl-utf8 wait-delay stdin-null cmd-shim powershell-shim retry"
          - scenario: terminate-each
            extra_flags: "--terminate-each"
            iters: "200"
            modes: "plain wait-delay stdin-null retry"
          - scenario: both
            extra_flags: "--terminate-each --bytes 4096"
            iters: "200"
            modes: "plain wait-delay stdin-null retry"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: build harness
        run: go build -o wsl-flake-repro.exe .

      - name: WSL status
        shell: pwsh
        run: |
          wsl.exe --status
          wsl.exe --version

      - name: import Alpine rootfs
        shell: pwsh
        env:
          ALPINE_VERSION: ${{ inputs.alpine_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $minor = $env:ALPINE_VERSION -replace '\.\d+$',''
          $url = "https://dl-cdn.alpinelinux.org/alpine/v$minor/releases/x86_64/alpine-minirootfs-$env:ALPINE_VERSION-x86_64.tar.gz"
          $rootfs = "$env:RUNNER_TEMP\alpine.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $rootfs
          $installDir = "$env:RUNNER_TEMP\alpine-wsl"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          wsl.exe --import alpine-repro $installDir $rootfs --version 2
          wsl.exe --list --verbose

      - name: install bash in the distro
        shell: pwsh
        run: |
          wsl.exe -d alpine-repro -- /sbin/apk add --no-cache bash

      - name: smoke-test bash and wslpath
        shell: pwsh
        run: |
          # Single-quote the outer PowerShell string so $(...) stays literal
          # and runs in the distro, not on the host.
          wsl.exe -d alpine-repro -- /bin/bash -c 'echo "prime: $(wslpath -u C:\\Windows)"'

      - name: run modes
        shell: pwsh
        env:
          ITERS: ${{ matrix.iters }}
          MODES: ${{ matrix.modes }}
          EXTRA_FLAGS: ${{ matrix.extra_flags }}
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $reproduced = @()
          foreach ($mode in $env:MODES.Split(" ")) {
            if (-not $mode) { continue }
            Write-Host "::group::mode=$mode"
            $tsv = "results/$mode.tsv"
            $extra = if ($env:EXTRA_FLAGS) { $env:EXTRA_FLAGS.Split(" ") } else { @() }
            & .\wsl-flake-repro.exe `
              --distro alpine-repro `
              --mode $mode `
              --iters ([int]$env:ITERS) `
              --out $tsv `
              @extra
            $exit = $LASTEXITCODE
            Write-Host "mode=$mode exit=$exit"
            if ($exit -eq 3) { $reproduced += $mode }
            Write-Host "::endgroup::"
          }
          if ($reproduced.Count -gt 0) {
            Write-Host "modes that reproduced the bug: $($reproduced -join ', ')"
          } else {
            Write-Host "no mode reproduced the bug in this scenario"
          }

      - name: upload TSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsv-${{ matrix.scenario }}
          path: results/

      - name: cleanup
        if: always()
        shell: pwsh
        run: |
          wsl.exe --unregister alpine-repro 2>$null
          wsl.exe --shutdown
